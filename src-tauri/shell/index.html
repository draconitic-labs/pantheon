<!doctype html>
<meta charset="utf-8">
<title>Pantheon 3D</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #ece7da; font: 16px/1.6 Georgia, serif; }
  main { max-width: 34em; padding: 18vh 2em 0; margin: auto; }
  h1 { font-weight: 400; font-size: 2em; margin: 0 0 .4em; }
  code { color: #d8b36a; }
</style>
<main>
  <h1>Pantheon 3D could not start</h1>
  <p id="why">Its data server did not come up.</p>
  <p>Run <code>pantheon-3d</code> from a terminal to read the error, and check that
  <code>pantheon-web/</code> and <code>assets/data/</code> are in the repository root.</p>
</main>
<script>
  const why = decodeURIComponent(location.hash.slice(1));
  if (why) document.getElementById('why').textContent = why;
</script>
